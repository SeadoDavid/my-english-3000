const DATA={"1": [{"id": "d01-01", "day": 1, "kind": "phrasal", "term": "wind down", "ipa": "/waɪnd daʊn/", "pos": "구동사", "meaning": "서서히 긴장을 풀다; 활동을 마무리하다", "pattern": "wind down after + 명사; wind down + 사업/운영; wind + 목적어 + down", "nuance": "사람은 바쁜 하루 뒤 천천히 쉬는 상태로 들어가고, 사업·프로젝트는 단계적으로 축소·종료한다. 즉각 멈추는 동작이 아니다.", "contrast": "잠자리에 바로 들다는 go to bed; 기계를 당장 끄다는 turn off. wind down은 점진적 전환.", "tip": "wind의 i는 /aɪ/; down의 /aʊ/에서 입을 크게 열었다 오므린다.", "examples": [{"en": "I usually wind down by reading before bed.", "ko": "나는 보통 잠들기 전 책을 읽으며 긴장을 푼다."}, {"en": "The company is winding down its operations in that market.", "ko": "회사는 해당 시장의 사업 운영을 단계적으로 축소하고 있다."}, {"en": "It takes me a while to wind down after a stressful day.", "ko": "스트레스가 심한 하루를 보낸 뒤 긴장을 푸는 데 시간이 좀 걸린다."}]}, {"id": "d01-02", "day": 1, "kind": "phrasal", "term": "catch up on", "ipa": "/kætʃ ʌp ɑn/", "pos": "구동사", "meaning": "밀린 일·소식·잠을 보충하다", "pattern": "catch up on + 명사/-ing; catch up with + 사람", "nuance": "밀린 이메일·뉴스·수면처럼 뒤처진 분량을 메우는 것. 사람을 오랜만에 만나 근황을 나눌 때는 catch up with.", "contrast": "catch up on emails (O); catch up with a friend (O). 사람과 만남을 catch up on my friend라고 하지 않는다.", "tip": "catch의 /æ/는 입을 넓게 벌리고 혀를 낮춘다.", "examples": [{"en": "I need to catch up on my emails this weekend.", "ko": "이번 주말에 밀린 이메일을 처리해야 해."}, {"en": "We spent the evening catching up on each other’s lives.", "ko": "우리는 저녁 내내 서로의 근황을 나눴다."}, {"en": "I’m trying to catch up on sleep after the trip.", "ko": "여행 후 부족한 잠을 보충하려고 한다."}]}, {"id": "d01-03", "day": 1, "kind": "phrasal", "term": "cut back on", "ipa": "/kʌt bæk ɑn/", "pos": "구동사", "meaning": "소비·사용·습관의 양을 줄이다", "pattern": "cut back on + 명사/-ing; cut back + 지출/인력", "nuance": "완전히 끊는 게 아니라 소비·빈도·양을 줄이는 것. 비용, 설탕, 스크린 타임 등에 적합하다.", "contrast": "cut back on coffee는 덜 마심; give up coffee는 끊음. cut back on meeting (X)보다 cut back on meetings.", "tip": "back과 on을 끊지 말고 자연스럽게 이어 발음.", "examples": [{"en": "I’m trying to cut back on caffeine.", "ko": "카페인 섭취를 줄이려고 해."}, {"en": "We may have to cut back on travel expenses.", "ko": "출장비를 줄여야 할 수도 있어."}, {"en": "She cut back on scrolling before bedtime.", "ko": "그녀는 잠들기 전 휴대폰을 넘겨보는 시간을 줄였다."}]}, {"id": "d01-04", "day": 1, "kind": "phrasal", "term": "figure out", "ipa": "/ˈfɪɡjər aʊt/", "pos": "구동사", "meaning": "생각하거나 조사해 이해·해결하다", "pattern": "figure out + 명사/의문사절; figure + 대명사 + out", "nuance": "바로 알지 못하던 원인·방법·규칙을 고민해 알아내는 과정에 초점. 단순 사실을 우연히 듣는 find out과 다르다.", "contrast": "figure it out (O), figure out it (X). figure out how to connect (O).", "tip": "figure의 /ɡj/는 g 다음 y가 부드럽게 이어진다.", "examples": [{"en": "I can’t figure out why the app keeps crashing.", "ko": "앱이 왜 계속 종료되는지 모르겠어."}, {"en": "We finally figured out how to reproduce the issue.", "ko": "마침내 그 문제를 재현하는 방법을 알아냈다."}, {"en": "Give me a minute to figure it out.", "ko": "잠깐만, 해결 방법을 생각해 볼게."}]}, {"id": "d01-05", "day": 1, "kind": "phrasal", "term": "back out of", "ipa": "/bæk aʊt əv/", "pos": "구동사", "meaning": "약속·계획·거래에서 빠지다", "pattern": "back out of + 명사/-ing", "nuance": "이미 참여하기로 하거나 동의한 일을 나중에 철회하는 상황. 신뢰에 영향을 줄 수 있다는 부정적 뉘앙스가 종종 있다.", "contrast": "그냥 참석하지 못한다는 can’t make it; 동의했던 계약에서 빠진다는 back out of the deal.", "tip": "out of는 자연스러운 연결에서 /aʊɾəv/처럼 들릴 수 있다.", "examples": [{"en": "He backed out of the trip at the last minute.", "ko": "그는 마지막 순간에 여행 계획에서 빠졌다."}, {"en": "The customer backed out of the agreement.", "ko": "고객이 합의를 철회했다."}, {"en": "I don’t want to back out after promising to help.", "ko": "도와주겠다고 약속한 뒤 빠지고 싶지는 않아."}]}, {"id": "d01-06", "day": 1, "kind": "phrasal", "term": "go over", "ipa": "/ɡoʊ ˈoʊvər/", "pos": "구동사", "meaning": "자료·계획을 함께 검토하다; 설명하며 훑다", "pattern": "go over + 문서/계획/세부사항; go over it", "nuance": "이미 있는 내용을 다시 읽고 검토·설명하는 것. 처음부터 새로 작성하는 create와 다르다.", "contrast": "go over the slides는 슬라이드 검토; go through the slides는 순서대로 하나씩 살펴보는 느낌이 더 강하다.", "tip": "go와 over 사이 모음이 자연스럽게 이어진다.", "examples": [{"en": "Can we go over the plan once more?", "ko": "계획을 한 번 더 검토할 수 있을까요?"}, {"en": "Let’s go over the key points before the call.", "ko": "통화 전에 핵심 사항을 검토합시다."}, {"en": "I went over the contract with our legal team.", "ko": "법무팀과 계약서를 검토했다."}]}, {"id": "d01-07", "day": 1, "kind": "phrasal", "term": "point out", "ipa": "/pɔɪnt aʊt/", "pos": "구동사", "meaning": "상대가 놓친 사실·문제를 짚어주다", "pattern": "point out + 명사/(that)절; point + 대명사 + out", "nuance": "상대의 주의를 특정 사실로 돌리는 것. 문제 지적뿐 아니라 장점·정보도 짚어줄 수 있다.", "contrast": "point it out (O), point out it (X). criticize는 비판 자체; point out은 사실을 알려줌.", "tip": "point의 /ɔɪ/는 입술을 둥글게 했다 옆으로 편다.", "examples": [{"en": "She pointed out a mistake in the report.", "ko": "그녀가 보고서의 실수를 짚어줬다."}, {"en": "I’d like to point out that this is only a temporary fix.", "ko": "이것은 임시 해결책일 뿐이라는 점을 말씀드리고 싶습니다."}, {"en": "Thanks for pointing that out.", "ko": "그 점을 알려줘서 고마워."}]}, {"id": "d01-08", "day": 1, "kind": "phrasal", "term": "set aside", "ipa": "/sɛt əˈsaɪd/", "pos": "구동사", "meaning": "시간·돈을 따로 확보하다; 문제를 잠시 제쳐두다", "pattern": "set aside + 시간/예산; set + 대명사 + aside", "nuance": "자원을 다른 용도로 쓰지 않도록 따로 떼어놓거나, 논쟁을 잠시 보류한다. 물리적으로 물건을 치워두는 뜻도 가능.", "contrast": "set aside two hours는 시간을 확보; put off a meeting은 회의 자체를 연기.", "tip": "aside의 두 번째 음절 /saɪd/에 강세.", "examples": [{"en": "I set aside thirty minutes for English practice.", "ko": "영어 연습을 위해 30분을 따로 확보해 둔다."}, {"en": "We should set aside some budget for training.", "ko": "교육을 위한 예산을 따로 마련해야 한다."}, {"en": "Let’s set our differences aside for now.", "ko": "일단 의견 차이는 잠시 접어둡시다."}]}, {"id": "d01-09", "day": 1, "kind": "phrasal", "term": "fall behind on", "ipa": "/fɔl bɪˈhaɪnd ɑn/", "pos": "구동사", "meaning": "업무·납부·일정에서 뒤처지다", "pattern": "fall behind on + 명사/-ing; fall behind schedule", "nuance": "해야 할 분량이나 기한을 따라가지 못하는 상황. 능력이 떨어진다는 의미는 반드시 아니다.", "contrast": "fall behind on payments는 납부가 밀림; be late for a meeting은 회의에 늦음.", "tip": "behind의 두 번째 음절에 강세; /h/를 살려 발음.", "examples": [{"en": "I fell behind on my reading last week.", "ko": "지난주에 독서 진도가 밀렸어."}, {"en": "We’re falling behind on the testing schedule.", "ko": "테스트 일정이 점점 밀리고 있다." ould choose an appropriate display for the environment.", "ko": "설치 환경에 적합한 디스플레이를 선택해야 한다."}, {"en": "That comment wasn’t appropriate in a formal meeting.", "ko": "그 발언은 공식 회의에 적절하지 않았다."}]}, {"id": "d01-19", "day": 1, "kind": "vocab", "term": "insight", "ipa": "/ˈɪnsaɪt/", "pos": "명사", "meaning": "표면을 넘어선 통찰·이해", "pattern": "gain insight into + 주제; valuable insights into + 분야", "nuance": "단순 사실 정보가 아니라 왜 그런지·무엇이 중요한지 파악한 깊은 이해.", "contrast": "information은 정보 자체; insight는 그 정보를 바탕으로 얻은 의미 있는 이해.", "tip": "첫 음절 /ɪn/ 강세; sight의 /aɪ/를 분명히.", "examples": [{"en": "The survey gave us useful insight into customer needs.", "ko": "그 설문은 고객의 요구를 이해하는 데 유용한 통찰을 주었다."}, {"en": "I gained a lot of insight from that conversation.", "ko": "그 대화에서 많은 통찰을 얻었다."}, {"en": "Could you share your insights into the local market?", "ko": "현지 시장에 대한 통찰을 공유해 주시겠어요?"}]}, {"id": "d01-20", "day": 1, "kind": "vocab", "term": "drawback", "ipa": "/ˈdrɔbæk/", "pos": "명사", "meaning": "선택·방식의 단점, 불리한 점", "pattern": "a drawback of + 명사/-ing; the main drawback is that + 절", "nuance": "어떤 대안의 장점은 인정하면서 그에 따르는 불리한 점을 논할 때 자연스럽다.", "contrast": "problem은 해결할 문제; drawback은 특정 선택에 내재한 단점.", "tip": "첫 음절 /drɔ/ 강세; /dr/을 연결.", "examples": [{"en": "The main drawback is the high maintenance cost.", "ko": "가장 큰 단점은 높은 유지비다."}, {"en": "One drawback of working remotely is feeling isolated.", "ko": "원격 근무의 한 가지 단점은 고립감을 느끼기 쉽다는 것이다."}, {"en": "What are the drawbacks of this approach?", "ko": "이 접근법의 단점은 무엇인가요?"}]}, {"id": "d01-21", "day": 1, "kind": "vocab", "term": "trade-off", "ipa": "/ˈtreɪdˌɔf/", "pos": "명사", "meaning": "하나를 얻기 위해 다른 것을 양보하는 상충관계", "pattern": "a trade-off between A and B; make a trade-off", "nuance": "둘 다 완벽히 얻기 어려워 한쪽의 이점을 위해 다른 쪽을 희생하는 구조. 단순한 단점 drawback과 구분.", "contrast": "a trade-off between cost and quality (O); trade-off of cost and quality보다 between이 자연스럽다.", "tip": "첫 음절 trade에 강세; /eɪ/를 길게.", "examples": [{"en": "There’s a trade-off between battery life and brightness.", "ko": "배터리 사용 : "이 정보가 아직도 정확한가요?"}, {"en": "We need an accurate estimate before committing.", "ko": "확답하기 전에 정확한 추정치가 필요하다."}, {"en": "The report is detailed, but not entirely accurate.", "ko": "그 보고서는 상세하지만 완전히 정확하지는 않다."}]}, {"id": "d01-25", "day": 1, "kind": "vocab", "term": "minor", "ipa": "/ˈmaɪnər/", "pos": "형용사", "meaning": "상대적으로 작은·경미한", "pattern": "a minor issue/change/delay; relatively minor", "nuance": "영향·규모가 크지 않다는 뜻. 무시해도 된다는 뜻은 아니며 안전 문제라면 minor라도 조치 필요.", "contrast": "minor issue는 작은 문제; trivial issue는 사소해서 중요하지 않은 문제라는 평가가 더 강하다.", "tip": "첫 음절 /maɪ/ 강세; r은 미국식으로 혀를 뒤로.", "examples": [{"en": "It’s a minor issue, so we can fix it later.", "ko": "작은 문제라 나중에 수정할 수 있어."}, {"en": "There was a minor delay due to traffic.", "ko": "교통 때문에 약간 지연됐다."}, {"en": "Even minor safety concerns should be reported.", "ko": "경미한 안전 우려라도 보고해야 한다."}]}, {"id": "d01-26", "day": 1, "kind": "vocab", "term": "valid", "ipa": "/ˈvælɪd/", "pos": "형용사", "meaning": "타당한; 유효한", "pattern": "a valid point/reason; valid until + 날짜", "nuance": "주장·근거가 합리적으로 성립하거나, 쿠폰·자격·문서가 법적/제도적으로 유효한 상태.", "contrast": "valid concern은 타당한 우려; correct concern은 일반적으로 어색하다.", "tip": "첫 음절 /væl/ 강세; /æ/는 입을 넓게.", "examples": [{"en": "That’s a valid point, and I agree.", "ko": "그건 타당한 지적이고 나도 동의해."}, {"en": "Is this voucher still valid?", "ko": "이 바우처는 아직 유효한가요?"}, {"en": "The customer raised a valid concern about security.", "ko": "고객이 보안에 관해 타당한 우려를 제기했다."}]}, {"id": "d01-27", "day": 1, "kind": "vocab", "term": "specific", "ipa": "/spəˈsɪfɪk/", "pos": "형용사", "meaning": "막연하지 않고 구체적인; 특정한", "pattern": "be specific about + 명사; specific requirements/examples", "nuance": "대상·내용을 분명하게 특정하거나 자세하게 말하는 것. detailed는 세부정보가 많은 것에 더 초점.", "contrast": "specific example은 정확히 짚은 사례; detailed example은 세부 묘사가 풍부한 사례.", "tip": "두 번째 음절 /sɪf/ 강세; /sp/를 한 번에.", "examples": [{"en": "Could you be more specific about the problem?", "ko": "문제가 무엇인지 좀 더 구체적으로 말씀해 주시겠어요?"}, {"en": "We need specific requirements before proposing a solution." 행을 막는 장벽.", "tip": "첫 음절 ob에 강세.", "examples": [{"en": "Traffic was the biggest obstacle today.", "ko": "오늘 가장 큰 걸림돌은 교통 체증이었어."}, {"en": "Compatibility is a major obstacle to deployment.", "ko": "호환성은 배포의 주요 장애물입니다."}, {"en": "We can overcome this obstacle together.", "ko": "우리는 이 장애물을 함께 극복할 수 있어."}]}, {"id": "d03-26", "day": 3, "kind": "vocab", "term": "insight", "ipa": "/ˈɪnˌsaɪt/", "pos": "명사", "meaning": "통찰; 유용한 이해", "pattern": "insight into + 문제 / gain insight", "nuance": "자료나 경험에서 얻은 깊은 이해.", "contrast": "information은 정보 자체, insight는 의미 있는 해석·깨달음.", "tip": "in에 강세.", "examples": [{"en": "That conversation gave me new insight.", "ko": "그 대화 덕분에 새로운 깨달음을 얻었어."}, {"en": "The survey provides insight into customer needs.", "ko": "설문조사는 고객 요구에 대한 통찰을 제공합니다."}, {"en": "Travel can give you insight into other cultures.", "ko": "여행은 다른 문화에 대한 이해를 넓혀 줘."}]}, {"id": "d03-27", "day": 3, "kind": "vocab", "term": "requirement", "ipa": "/rɪˈkwaɪərmənt/", "pos": "명사", "meaning": "요구사항; 필수 조건", "pattern": "requirement for + 대상 / meet a requirement", "nuance": "반드시 충족해야 하는 조건.", "contrast": "preference는 선호, requirement는 충족 의무.", "tip": "quire에 강세.", "examples": [{"en": "What are the requirements for joining?", "ko": "참여하려면 어떤 조건이 필요해?"}, {"en": "The product meets the customer’s requirements.", "ko": "제품이 고객 요구사항을 충족합니다."}, {"en": "A passport is a basic travel requirement.", "ko": "여권은 기본적인 여행 필수 조건이야."}]}, {"id": "d03-28", "day": 3, "kind": "vocab", "term": "resolve", "ipa": "/rɪˈzɑlv/", "pos": "동사", "meaning": "문제를 해결하다; 분쟁을 풀다", "pattern": "resolve + 문제 / 분쟁 / 의문", "nuance": "문제나 불확실성을 끝내는 해결을 표현.", "contrast": "fix는 고장 수리, resolve는 갈등·문제 전반의 해결.", "tip": "solve가 아니라 zolve처럼 /z/ 발음.", "examples": [{"en": "We need to resolve this before dinner.", "ko": "저녁 전에 이 문제를 해결해야 해."}, {"en": "The patch resolved the login issue.", "ko": "패치가 로그인 문제를 해결했습니다."}, {"en": "They resolved their disagreement calmly.", "ko": "그들은 차분히 의견 차이를 풀었어."}]}, {"id": "d03-29", "day": 3, "kind": "vocab", "term": "confirm", "ipa": "/kənˈfɝm/", "pos": "동사", "meaning": "확인하다; 확정하다", "pattern": "confirm + 명사 / confirm that + 절", "nuance": "정보가 맞는지 검증하거나 일정을 확정할 때.", "contrast": "check는 확인 과정, confirm은 맞다고 확정하는 결과.", "tip": "firm에 강세.", "examples": [{"en": "Can you confirm our reservation?", "ko": "예약을 확인해 줄래?"}, {"en": "Please confirm the final delivery date.", "ko": "최종 납품일을 확인해 주세요."}, {"en": "I’ll confirm that everyone is coming.", "ko": "모두 오는지 확인할게."}]}, {"id": "d03-30", "day": 3, "kind": "vocab", "term": "prioritize", "ipa": "/praɪˈɔrəˌtaɪz/", "pos": "동사", "meaning": "우선순위를 정하다", "pattern": "prioritize + 업무 / prioritize A over B", "nuance": "여러 일 중 먼저 처리할 대상을 정할 때.", "contrast": "organize는 정리, prioritize는 중요도에 따른 순서 결정.", "tip": "or에 주강세.", "examples": [{"en": "I need to prioritize sleep this week.", "ko": "이번 주에는 잠을 우선해야 해."}, {"en": "Let’s prioritize the critical defects.", "ko": "중대한 결함부터 우선 처리합시다."}, {"en": "We should prioritize safety over speed.", "ko": "속도보다 안전을 우선해야 해."}]}]};
const $=id=>document.getElementById(id);let day=Math.max(...Object.keys(DATA).map(Number)),index=0,hidden=true;
function speak(t){if(!('speechSynthesis'in window)){alert('이 브라우저는 음성 재생을 지원하지 않습니다.');return;}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.88;const voice=speechSynthesis.getVoices().find(v=>v.lang.toLowerCase().startsWith('en-us'));if(voice)u.voice=voice;speechSynthesis.speak(u)}
function render(){let c=DATA[day][index];$('counter').textContent=`Day ${String(day).padStart(2,'0')} · ${index+1} / 30`;$('term').textContent=c.term;$('ipa').textContent=c.ipa||'';$('kind').textContent=c.kind==='phrasal'?'구동사':'핵심 어휘';$('meaning').textContent=c.meaning;$('examples').replaceChildren();(c.examples||[]).forEach(e=>{let el=document.createElement('div');el.className='example';let en=document.createElement('div');en.className='en';en.textContent=e.en;let b=document.createElement('button');b.className='speak';b.textContent='▶';b.title='예문 듣기';b.setAttribute('aria-label','예문 듣기');b.onclick=()=>speak(e.en);en.append(b);let ko=document.createElement('div');ko.className='ko';ko.textContent=e.ko;el.append(en,ko);$('examples').append(el)});$('notes').replaceChildren();[['패턴',c.pattern],['뉘앙스',c.nuance],['비슷한 표현과 차이',c.contrast],['발음 팁',c.tip]].forEach(([name,val])=>{if(!val)return;let d=document.createElement('div');d.className='note';let b=document.createElement('b');b.textContent=name+' · ';d.append(b,document.createTextNode(val));$('notes').append(d)});$('study').classList.toggle('hide',hidden);$('toggle').textContent=hidden?'뜻 보기':'뜻 숨기기';$('prev').disabled=index===0;$('next').disabled=index===29;localStorage.setItem('english3000-simple-day',day);localStorage.setItem('english3000-simple-index-'+day,index)}
function openCard(i){index=i;hidden=true;$('list').hidden=true;$('study').hidden=false;render()}
function showList(){let root=$('items');root.replaceChildren();DATA[day].forEach((c,i)=>{let b=document.createElement('button');b.style.cssText='display:block;width:100%;text-align:left;border:0;border-bottom:1px solid #eee;border-radius:0;padding:10px 5px';b.textContent=String(i+1).padStart(2,'0')+'  '+c.term;b.onclick=()=>openCard(i);root.append(b)});$('study').hidden=true;$('list').hidden=false;$('counter').textContent=`Day ${String(day).padStart(2,'0')} · 전체 ${DATA[day].length}개`}
$('day').onchange=()=>{day=Number($('day').value);index=0;hidden=true;showList()};$('sayTerm').onclick=()=>speak(DATA[day][index].term);$('toggle').onclick=()=>{hidden=!hidden;render()};$('prev').onclick=()=>{if(index>0)openCard(index-1)};$('next').onclick=()=>{if(index<DATA[day].length-1)openCard(index+1)};$('all').onclick=showList;$('back').onclick=()=>openCard(index);$('day').value=day;showList();
</script></body></html>
