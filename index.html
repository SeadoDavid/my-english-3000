<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#ffffff"><title>My English 3000</title><style>
:root{font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;color:#202124;background:#fff}*{box-sizing:border-box}body{margin:0}main{max-width:680px;margin:auto;padding:22px 18px 65px}header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #e5e5e5;padding-bottom:17px;gap:10px}h1{font-size:19px;letter-spacing:-.5px;margin:0}select,button{font:inherit;background:white;color:inherit;border:1px solid #d7d7d7;border-radius:7px;padding:9px 12px;cursor:pointer}button:hover{background:#f7f7f7}button:focus-visible,select:focus-visible{outline:2px solid #333;outline-offset:2px}.meta{color:#777;font-size:13px;margin:16px 0 7px}.word{font-size:32px;font-weight:650;letter-spacing:-.8px;margin:0 0 5px}.ipa{color:#777;font-size:15px}.speak{padding:5px 9px;margin-left:9px;font-size:13px}.meaning{font-size:18px;margin:15px 0}.example{border-top:1px solid #eee;padding:10px 0}.en{font-size:16px;line-height:1.4}.ko{font-size:14px;color:#666;margin-top:5px;line-height:1.4}.note{font-size:14px;line-height:1.45;color:#444;padding:9px 0;border-top:1px solid #eee}.note b{color:#222}.bottom{display:flex;gap:10px;margin-top:16px}.bottom button{flex:1}.bottom button:disabled{opacity:.3}.subtle{color:#777;font-size:12px;margin-top:16px}.hide .meaning,.hide .ko,.hide .notes{display:none}.hide .example{border-color:#f1f1f1}.actions{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}.actions button{font-size:13px}.daylist{display:flex;gap:5px;align-items:center}.kind{color:#777;font-size:13px;margin-top:4px}@media(max-width:450px){.word{font-size:29px}main{padding:19px 16px 50px}h1{font-size:18px}}
.voice-controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:14px;font-size:14px}.voice-controls select{flex:1;min-width:140px;max-width:100%;font-size:14px}.voice-controls button{font-size:14px}.voice-status{width:100%;font-size:13px;color:#666;margin:0;line-height:1.4}</style></head><body><main><header><h1>My English 3000</h1><div class="daylist"><label for="day" style="font-size:13px;color:#666">Day</label><select id="day" aria-label="학습 날짜"></select></div></header><div class="voice-controls"><label for="voice">목소리</label><select id="voice" aria-label="영어 목소리"><option value="">기본 영어 음성</option></select><button id="previewVoice">미리 듣기</button><p class="voice-status" id="voiceStatus" role="status"></p></div><div class="meta" id="counter"></div><section id="study" hidden><h2 class="word" id="term"></h2><div><span class="ipa" id="ipa"></span><button class="speak" id="sayTerm" aria-label="단어 발음 듣기">▶ 듣기</button></div><div class="kind" id="kind"></div><div class="actions"><button id="toggle">뜻 보기</button><button id="all">전체 목록</button></div><div class="meaning" id="meaning"></div><div class="notes" id="notes"></div><div id="examples"></div><div class="bottom"><button id="prev">← 이전</button><button id="next">다음 →</button></div><div class="subtle">선택한 목소리로 단어와 예문을 읽습니다. 음성 목록은 기기와 브라우저에 따라 달라집니다.</div></section><section id="list" hidden><div class="meta">단어를 선택하세요</div><div id="items"></div><button id="back" style="margin-top:15px">← 카드로 돌아가기</button></section></main><script src="data/manifest.js"></script><script>
async function start(){
const manifest=window.ENGLISH_MANIFEST;
if(!Array.isArray(manifest)||!manifest.length) throw new Error("학습 목록을 찾을 수 없습니다.");
await Promise.all(manifest.map(entry=>new Promise((resolve,reject)=>{
 const script=document.createElement("script");script.src=entry.file;
 script.onload=()=>resolve();script.onerror=()=>reject(new Error("Day "+entry.day+" 데이터를 불러오지 못했습니다."));document.head.append(script);
})));
for(const entry of manifest){
 if(!Array.isArray(window.ENGLISH_LESSONS?.[entry.day])||window.ENGLISH_LESSONS[entry.day].length!==30) throw new Error("Day "+entry.day+" 데이터가 올바르지 않습니다.");
 const option=document.createElement("option");option.value=entry.day;option.textContent=String(entry.day).padStart(2,"0");document.getElementById("day").append(option);
}
const DATA=window.ENGLISH_LESSONS;
const $=id=>document.getElementById(id);let day=Math.max(...Object.keys(DATA).map(Number)),index=0,hidden=true;
const VOICE_KEY='english3000-voice';let englishVoices=[],selectedVoice=localStorage.getItem(VOICE_KEY)||'';
function loadVoices(){if(!('speechSynthesis' in window)){$('voice').disabled=true;$('previewVoice').disabled=true;$('voiceStatus').textContent='이 브라우저는 음성 재생을 지원하지 않습니다.';return;}englishVoices=speechSynthesis.getVoices().filter(v=>/^en(?:[-_]|$)/i.test(v.lang));const select=$('voice');select.replaceChildren();let base=document.createElement('option');base.value='';base.textContent='기본 영어 음성';select.append(base);englishVoices.forEach(v=>{let option=document.createElement('option');option.value=v.voiceURI;option.textContent=v.name+' · '+v.lang;select.append(option)});select.value=englishVoices.some(v=>v.voiceURI===selectedVoice)?selectedVoice:'';$('voiceStatus').textContent=selectedVoice&&!englishVoices.some(v=>v.voiceURI===selectedVoice)?'저장한 목소리를 이 기기에서 찾을 수 없어 기본 음성으로 재생합니다.':englishVoices.length?'선택한 목소리는 이 브라우저에 저장됩니다.':'영어 음성이 아직 없습니다. 기기에 영어 음성을 추가한 뒤 새로고침해 주세요.';}
function speak(t){if(!('speechSynthesis'in window)){alert('이 브라우저는 음성 재생을 지원하지 않습니다.');return;}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);const voice=englishVoices.find(v=>v.voiceURI===selectedVoice);u.lang=voice?voice.lang:'en-US';u.rate=.95;if(voice)u.voice=voice;speechSynthesis.speak(u)}
$('voice').onchange=()=>{selectedVoice=$('voice').value;localStorage.setItem(VOICE_KEY,selectedVoice);speechSynthesis.cancel();$('voiceStatus').textContent='목소리를 저장했습니다. 미리 듣기로 확인해 보세요.'};$('previewVoice').onclick=()=>speak('Hello! Let’s practice English together.');loadVoices();if('speechSynthesis' in window)speechSynthesis.addEventListener('voiceschanged',loadVoices);
function render(){let c=DATA[day][index];$('counter').textContent=`Day ${String(day).padStart(2,'0')} · ${index+1} / 30`;$('term').textContent=c.term;$('ipa').textContent=c.ipa||'';$('kind').textContent=c.kind==='phrasal'?'구동사':'핵심 어휘';$('meaning').textContent=c.meaning;$('examples').replaceChildren();(c.examples||[]).forEach(e=>{let el=document.createElement('div');el.className='example';let en=document.createElement('div');en.className='en';en.textContent=e.en;let b=document.createElement('button');b.className='speak';b.textContent='▶';b.title='예문 듣기';b.setAttribute('aria-label','예문 듣기');b.onclick=()=>speak(e.en);en.append(b);let ko=document.createElement('div');ko.className='ko';ko.textContent=e.ko;el.append(en,ko);$('examples').append(el)});$('notes').replaceChildren();[['패턴',c.pattern],['뉘앙스',c.nuance],['비슷한 표현과 차이',c.contrast],['발음 팁',c.tip]].forEach(([name,val])=>{if(!val)return;let d=document.createElement('div');d.className='note';let b=document.createElement('b');b.textContent=name+' · ';d.append(b,document.createTextNode(val));$('notes').append(d)});$('study').classList.toggle('hide',hidden);$('toggle').textContent=hidden?'뜻 보기':'뜻 숨기기';$('prev').disabled=index===0;$('next').disabled=index===29;localStorage.setItem('english3000-simple-day',day);localStorage.setItem('english3000-simple-index-'+day,index)}
function openCard(i){index=i;hidden=true;$('list').hidden=true;$('study').hidden=false;render()}
function showList(){let root=$('items');root.replaceChildren();DATA[day].forEach((c,i)=>{let b=document.createElement('button');b.style.cssText='display:block;width:100%;text-align:left;border:0;border-bottom:1px solid #eee;border-radius:0;padding:10px 5px';b.textContent=String(i+1).padStart(2,'0')+'  '+c.term;b.onclick=()=>openCard(i);root.append(b)});$('study').hidden=true;$('list').hidden=false;$('counter').textContent=`Day ${String(day).padStart(2,'0')} · 전체 ${DATA[day].length}개`}
$('day').onchange=()=>{day=Number($('day').value);index=0;hidden=true;showList()};$('sayTerm').onclick=()=>speak(DATA[day][index].term);$('toggle').onclick=()=>{hidden=!hidden;render()};$('prev').onclick=()=>{if(index>0)openCard(index-1)};$('next').onclick=()=>{if(index<DATA[day].length-1)openCard(index+1)};$('all').onclick=showList;$('back').onclick=()=>openCard(index);$('day').value=day;showList();
}
start().catch(error=>{document.getElementById("counter").textContent=error.message+" 새로고침해서 다시 시도해 주세요.";document.getElementById("day").disabled=true;});
</script></body></html>
